name: CI - car-rental-service

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: car-rental-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/car-rental-service

jobs:
  tests:
    name: Java tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle
          cache-dependency-path: apps/car-rental-service/**/*.gradle*

      - name: Run tests
        working-directory: apps/car-rental-service
        run: ./gradlew clean test

      - name: Upload Java test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports
          path: |
            apps/car-rental-service/build/test-results/test/
            apps/car-rental-service/build/reports/tests/test/
          if-no-files-found: warn
          retention-days: 7

  quality:
    name: Java quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle
          cache-dependency-path: apps/car-rental-service/**/*.gradle*

      - name: Run Checkstyle
        working-directory: apps/car-rental-service
        run: ./gradlew checkstyleMain checkstyleTest

      - name: Upload Checkstyle reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-checkstyle-reports
          path: apps/car-rental-service/build/reports/checkstyle/
          if-no-files-found: warn
          retention-days: 7

  image:
    name: Java Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [tests, quality]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and optionally push image
        uses: docker/build-push-action@v6
        with:
          context: apps/car-rental-service
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=car-rental-service
          cache-to: type=gha,scope=car-rental-service,mode=max
